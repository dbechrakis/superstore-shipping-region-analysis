<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7f8fa"/><text x="48" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#172033">Superstore Sales — Executive Dashboard</text><text x="48" y="82" font-family="Arial" font-size="14" fill="#667085">Regional profitability • shipping performance • commercial drivers</text><g font-family="Arial"><rect x="48" y="110" width="250" height="95" rx="12" fill="white" stroke="#e4e7ec"/><text x="68" y="142" font-size="13" fill="#667085">TOTAL SALES</text><text x="68" y="178" font-size="27" font-weight="700" fill="#172033">$2.30M</text><rect x="318" y="110" width="250" height="95" rx="12" fill="white" stroke="#e4e7ec"/><text x="338" y="142" font-size="13" fill="#667085">TOTAL PROFIT</text><text x="338" y="178" font-size="27" font-weight="700" fill="#172033">$286.40K</text><rect x="588" y="110" width="250" height="95" rx="12" fill="white" stroke="#e4e7ec"/><text x="608" y="142" font-size="13" fill="#667085">PROFIT MARGIN</text><text x="608" y="178" font-size="27" font-weight="700" fill="#172033">12.47%</text><rect x="858" y="110" width="294" height="95" rx="12" fill="white" stroke="#e4e7ec"/><text x="878" y="142" font-size="13" fill="#667085">KEY SIGNAL</text><text x="878" y="174" font-size="18" font-weight="700" fill="#172033">Central margin gap</text><text x="878" y="194" font-size="12" fill="#667085">7.92% vs 14.94% West</text><rect x="48" y="230" width="535" height="390" rx="12" fill="white" stroke="#e4e7ec"/><text x="72" y="264" font-size="18" font-weight="700" fill="#172033">Profit margin by region</text><line x1="100" y1="560" x2="540" y2="560" stroke="#98a2b3"/><g fill="#475467"><rect x="125" y="390" width="65" height="170"/><rect x="230" y="415" width="65" height="145"/><rect x="335" y="478" width="65" height="82"/><rect x="440" y="350" width="65" height="210"/></g><g font-size="13" text-anchor="middle" fill="#475467"><text x="157"